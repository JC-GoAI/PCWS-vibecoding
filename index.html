<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>親子共創 AI 學習助手</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="favicon.png">
    <style>
    :root {
        --goai-blue: #022169;
        --goai-blue-hover: #12338f;
        --goai-yellow: #fecf13;
        --goai-green: #3d7a3a;
        --card-green: #00cd7a;
        --goai-orange: #ff8b12;
        --white: #ffffff;
        --grey: #f4f6fa;
    }
    body {
        font-family: "PingFang HK", "Helvetica Neue", "Microsoft JhengHei", sans-serif;
        margin: 0;
        background: var(--grey);
        color: #1a202c;
        display: flex;
        flex-direction: column;
        align-items: center;
        -webkit-font-smoothing: antialiased;
    }
    header {
        width: 100%;
        background: var(--goai-blue);
        color: var(--white);
        padding: 10px 28px;
        box-sizing: border-box;
        position: relative;
        overflow: hidden;
        border-radius: 0 0 16px 16px;
        box-shadow: 0 4px 15px rgba(2, 33, 105, 0.1);
    }
    .header-home {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 16px;
    }
    .header-home:hover h1 { color: var(--goai-yellow); }
    .header-home:focus-visible { outline: 3px solid var(--goai-yellow); outline-offset: 4px; }
    .header-logo { height: 88px; width: auto; display: block; object-fit: contain; filter: drop-shadow(0px 4px 15px rgba(0,0,0,0.2)); }
    .header-text { text-align: left; display: flex; flex-direction: column; gap: 4px; }
    header h1 { margin: 0; font-size: 1.85rem; font-weight: 900; letter-spacing: 0.5px; line-height: 1.3; }
    .header-sub { margin: 0; font-size: 0.95rem; color: #cbd5e1; font-weight: 600; }
    .highlight-yellow { color: var(--goai-yellow); font-weight: bold; }
    .cartoon-shape {
        position: absolute; border-radius: 30px; padding: 8px 18px; font-size: 13px; font-weight: bold;
        box-shadow: 0 6px 0 rgba(0,0,0,0.15); z-index: 1;
    }
    .shape-monster1 { left: 3%; top: 18%; background: var(--card-green); color: white; transform: rotate(-8deg); }
    .shape-monster2 { right: 3%; bottom: 16%; background: var(--goai-orange); color: white; transform: rotate(10deg); }
    #app { width: calc(100% - 48px); max-width: none; margin: 18px auto 0; display: flex; flex-direction: column; gap: 20px; box-sizing: border-box; }
    .column {
        background: var(--white); padding: 28px; border-radius: 24px;
        box-shadow: 0 10px 25px rgba(10, 34, 102, 0.03); box-sizing: border-box;
    }
    .card-blue { border-top: 8px solid var(--goai-blue); }
    .card-orange { border-top: 8px solid var(--goai-orange); }
    .column h2 { margin: 0 0 8px; color: var(--goai-blue); font-weight: 800; font-size: 1.45rem; display: flex; align-items: center; gap: 8px; }
    .lede { color: #4a5568; line-height: 1.65; margin: 0 0 16px; text-align: center; }
    .note {
        background: #eef3ff; color: var(--goai-blue); border-radius: 12px;
        padding: 12px 14px; font-weight: 700; line-height: 1.65; margin: 0 0 12px;
    }
    .primary-btn, .ghost-btn, .pill-btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px;
        padding: 0 22px; border-radius: 50px; font-size: 1rem; font-weight: 800; cursor: pointer;
        border: 2px solid transparent; box-sizing: border-box; font-family: inherit;
    }
    .primary-btn { background: var(--goai-blue); color: #fff; box-shadow: 0 4px 12px rgba(10, 34, 102, 0.12); }
    .primary-btn:hover { background: var(--goai-blue-hover); }
    .ghost-btn { background: #fff; color: var(--goai-blue); border-color: #cbd5e1; }
    .pill-btn { background: #fff; color: var(--goai-blue); border-color: #e6eaf1; border-radius: 999px; min-height: 40px; padding: 8px 18px; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05); }
    .pill-btn.on, .pill-btn[aria-pressed="true"] { background: var(--goai-blue); border-color: var(--goai-blue); color: #fff; box-shadow: none; }
    .seg-bar {
        display: flex; align-items: stretch; gap: 6px; background: #f3f5f9;
        border-radius: 18px; padding: 6px; margin: 0 0 18px;
    }
    .seg-btn {
        flex: 1; border: 0; background: transparent; color: var(--goai-blue);
        font: inherit; font-weight: 800; font-size: 0.95rem; line-height: 1.35;
        min-height: 52px; padding: 10px 12px; border-radius: 14px; cursor: pointer;
        text-align: center;
    }
    .seg-btn.on { background: var(--goai-blue); color: #fff; box-shadow: 0 8px 18px rgba(2, 33, 105, 0.18); }
    .chip-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 0 0 16px; }
    .src-line { margin: 16px 0 0; font-size: 0.78rem; line-height: 1.45; font-weight: 700; color: #64748b; text-align: center; }
    .field .chip-row { justify-content: flex-start; margin-bottom: 0; }
    .tab-bar {
        display: flex; align-items: center; gap: 4px; background: #eef1f6;
        border-radius: 16px; padding: 6px; margin: 0 0 14px; overflow-x: auto;
    }
    .tab-btn {
        flex: 1 0 auto; border: 0; background: transparent; color: var(--goai-blue);
        font: inherit; font-weight: 800; font-size: 0.95rem; min-height: 46px;
        padding: 10px 16px; border-radius: 12px; cursor: pointer; white-space: nowrap;
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .tab-btn.on { background: var(--goai-blue); color: #fff; box-shadow: 0 6px 16px rgba(2, 33, 105, 0.16); }
    .tab-btn .ico { width: 0.95em; height: 0.95em; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; align-items: center; }
    .choice-card {
        background: #fff; border: 3px solid #e2e8f0; border-radius: 18px; padding: 16px 12px;
        cursor: pointer; text-align: center; width: 168px; box-sizing: border-box; font: inherit; color: inherit;
    }
    .choice-card.wide { width: 220px; }
    .choice-card h3 { margin: 0; font-size: 1.05rem; color: var(--goai-blue); line-height: 1.35; }
    .choice-card.on h3, .choice-card.on .meta { color: #fff; }
    .tier-blue { border-color: var(--goai-blue); }
    .tier-blue.on { background: var(--goai-blue); }
    .tier-orange { border-color: var(--goai-orange); }
    .tier-orange.on { background: #c2410c; }
    .tier-green { border-color: var(--goai-green); }
    .tier-green.on { background: var(--goai-green); }
    .tier-yellow { border-color: var(--goai-yellow); }
    .tier-yellow.on { background: #8a6500; }
    .meta { font-size: 0.8rem; font-weight: 800; color: var(--goai-orange); margin-bottom: 6px; }
    textarea, input[type="password"] {
        width: 100%; box-sizing: border-box; border: 2px solid #e2e8f0; border-radius: 12px;
        padding: 12px; font: inherit; line-height: 1.55; background: #fff;
    }
    .error-text { color: #c53030; font-size: 0.9rem; font-weight: 700; margin: 8px 0 0; }
    .pass-box { max-width: 420px; margin: 16px auto 0; background: #f7f9fc; border-radius: 16px; padding: 16px; border: 2px solid #e2e8f0; }
    .pass-box .btn-row { justify-content: center; }
    .pass-box .primary-btn { width: 100%; }
    .game-lock-row { display: flex; justify-content: flex-start; margin-top: 14px; }
    .modal-back {
        position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center;
        padding: 20px; background: rgba(15, 23, 42, 0.45); box-sizing: border-box;
    }
    .modal-back[hidden] { display: none; }
    .modal-card {
        width: min(100%, 420px); background: #fff; border-radius: 20px; padding: 24px;
        box-shadow: 0 20px 50px rgba(2, 33, 105, 0.22); box-sizing: border-box;
    }
    .modal-card .lede { margin-bottom: 14px; }
    .modal-card .btn-row { justify-content: center; }
    .make-layout { display: flex; align-items: flex-start; gap: 18px; }
    .make-main { flex: 2 1 0; min-width: 0; }
    .make-side { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: stretch; gap: 10px; position: sticky; top: 12px; }
    .make-side .pill-btn { width: 100%; }
    .make-block { margin: 0 0 16px; }
    .make-block h3 { margin: 0 0 6px; color: var(--goai-blue); font-size: 1.15rem; }
    .make-block textarea { min-height: 96px; resize: vertical; }
    .make-hint { margin: 0 0 8px; color: #4a5568; font-weight: 700; line-height: 1.55; }
    .make-examples { margin-top: 8px; }
    .make-examples .lede { text-align: left; margin-bottom: 10px; }
    .make-examples .chip-row { justify-content: flex-start; }
    .tip-panel { display: flex; flex-direction: column; gap: 8px; }
    .tip-item { background: #f7f9fc; border: 2px solid #e2e8f0; border-radius: 14px; padding: 10px; }
    .tip-item p { margin: 0 0 8px; line-height: 1.5; font-weight: 700; }
    .tip-item .pill-btn { width: auto; min-height: 34px; }
    .site-footer {
        width: 100%; margin-top: 48px; padding: 28px 20px; background: #f7f8fb; color: #8a9099;
        font-size: 13px; text-align: center; line-height: 1.6; box-sizing: border-box;
    }
    .ico { width: 1.15em; height: 1.15em; flex: 0 0 auto; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .pick-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    .make-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    .level { margin-top: 14px; padding: 12px; border-radius: 14px; border: 3px solid var(--goai-blue); background: #fff; }
    .level.lv2 { border-color: var(--goai-orange); }
    .level.lv3 { border-color: var(--goai-green); }
    .thumb-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 0 0 8px; }
    .thumb-card {
        display: flex; flex-direction: column; align-items: center; gap: 6px;
        width: min(100%, 280px); text-decoration: none; color: var(--goai-blue); font-weight: 800; font-size: 0.9rem;
    }
    .thumb-card img {
        width: 100%; height: 200px; object-fit: contain; object-position: top center;
        background: #fff; border: 2px solid #cbd5e1; border-radius: 12px;
    }
    .level h3 { margin: 0 0 8px; color: var(--goai-blue); font-size: 1.05rem; }
    .field { margin: 14px 0; }
    .field .lab { display: block; font-weight: 800; color: var(--goai-blue); margin-bottom: 8px; }
    .copy-ok { color: var(--goai-green); font-weight: 800; }
    .panel {
        margin-top: 16px; background: #f7f9fc; border-radius: 16px; padding: 16px;
        border: 2px solid #e2e8f0;
    }
    .route-card h3 { font-size: 1.2rem; }
    .band-row { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; }
    .band-card {
        flex: 1 1 240px; max-width: 340px; min-height: 240px; border: 3px solid #e2e8f0; border-radius: 28px;
        background: #fff; color: var(--goai-blue); font: inherit; font-weight: 800; cursor: pointer;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        padding: 28px 18px; box-shadow: 0 12px 28px rgba(10, 34, 102, 0.06);
    }
    .band-card:hover { border-color: var(--goai-blue); transform: translateY(-2px); }
    .band-card strong { font-size: 1.7rem; }
    .band-card em { font-style: normal; color: #4a5568; font-size: 0.95rem; font-weight: 700; }
    .band-ico { width: 76px; height: 76px; stroke: var(--goai-blue); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .back-row { display: flex; justify-content: flex-end; margin: 0 0 10px; }
    .back-btn {
        border: 0; background: transparent; color: var(--goai-blue); font: inherit; font-weight: 800;
        cursor: pointer; padding: 4px 2px;
    }
    .game-frame {
        display: block; width: 100%; height: calc(100vh - 250px); min-height: 720px;
        border: 0; border-radius: 18px; background: #fffbf0;
    }
    .game-tools { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .game-tools .ghost-btn { flex: 1 1 200px; }
    .game-tools .ghost-btn[aria-expanded="true"] { background: var(--goai-blue); color: #fff; border-color: var(--goai-blue); }
    .reveal-panel {
        display: none; margin-top: 12px; background: #f7f9fc; border: 2px solid #e2e8f0;
        border-radius: 16px; padding: 16px; max-height: 70vh; overflow: auto;
    }
    .reveal-panel.open { display: block; }
    .nocopy, .nocopy * {
        user-select: none; -webkit-user-select: none; -moz-user-select: none;
        -webkit-touch-callout: none; -webkit-user-drag: none;
    }
    .prompt-view { margin: 0; white-space: pre-wrap; line-height: 1.7; font: inherit; color: #1a202c; }
    .chat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
    .chat-shot { position: relative; margin: 0; min-width: 0; }
    .chat-shot img {
        display: block; width: 100%; height: auto; max-width: 100%;
        border-radius: 12px; pointer-events: none;
    }
    #chat-img-1 { max-width: min(100%, 845px); }
    #chat-img-2 { max-width: min(100%, 964px); }
    .chat-shield { position: absolute; inset: 0; }
    .chat-pager { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 14px; }
    .chat-pager .ghost-btn { flex: 0 1 140px; }
    .chat-pager .ghost-btn:disabled { opacity: 0.45; cursor: default; }
    @media print { .nocopy { display: none !important; } }
    @media (max-width: 768px) {
        header { padding: 10px 16px; }
        #app { width: calc(100% - 24px); }
        .header-home { flex-direction: column; text-align: center; gap: 8px; }
        .header-logo { height: 64px; }
        .header-text { text-align: center; }
        header h1 { font-size: 1.35rem; }
        .cartoon-shape {
            position: relative; display: inline-block; margin: 5px;
            left: auto !important; right: auto !important; top: auto !important; bottom: auto !important; transform: none !important;
        }
        .column { padding: 20px; }
        .seg-bar { flex-direction: column; }
        .band-card { max-width: none; min-height: 180px; }
        .make-layout { flex-direction: column; }
        .make-side { width: 100%; flex-basis: auto; position: static; }
    }
    </style>
</head>
<body>
<header>
    <div class="cartoon-shape shape-monster1">Prompting</div>
    <div class="cartoon-shape shape-monster2">Vibe Coding</div>
    <button type="button" class="header-home" data-action="home" aria-label="返回開始版面">
        <img src="logo.jpg?v=crop" alt="" class="header-logo">
        <div class="header-text">
            <h1>親子共創 <span class="highlight-yellow">AI</span> 學習助手</h1>

</header>
<main id="app"></main>

<script>
const STORAGE_KEY = "pcws-coach-v1";
const LOCK_PASS = { vibe: "jcgoai", make: "pcws", help: "clear" };
function makeGrade() {
    return state.band === "sec" ? "中一至中三" : "小四至小六";
}

function makeScaffold() {
    return {
        role: "你是一位擅長製作______教育遊戲的前端工程師。",
        task: "請建立可直接遊玩的單頁遊戲《______》：______。畫面要有遊戲感，不要像測驗卷或工作紙。\n遊戲機制：\n1. 玩家是______。畫面上有______。玩家要______。\n2. 答對就______。答錯就______。______就遊戲結束。\n3. 連續答對會______。難度會______。\n4. 題目包括______。結束後先顯示______。",
        limit: "- 香港書面語繁體中文，適合" + makeGrade() + "\n- 支援滑鼠、觸控、手機及電腦\n- HTML、CSS、JavaScript 全部放在單一檔案，開啟即可執行\n- 每題只有一個正確答案\n- 動畫要流暢：物件移動、答對有反應、答錯有反應、得分特效"
    };
}

function makeTips() {
    return [
        "你是一位製作小遊戲的工程師。",
        "請做一個可以打開就玩的網頁遊戲。",
        "玩家選出正確答案。選對會加分。選錯可以再試。",
        "畫面要似遊戲，不要似工作紙。",
        "用繁體中文，適合" + makeGrade() + "。",
        "全部放在一個檔案，打開就可以玩。"
    ];
}

const MAKE_EXAMPLES_PRI = [
    {
        id: "vocab",
        label: "英文生字",
        role: "You are a front-end engineer who is good at making English learning games for children.",
        task: "Build a single-page game that can be played at once, called Sky Pop: a bright sky above a bookshop roof. Balloons are large, colours are candy-bright, and the text is clear. It must feel like a game, not a worksheet.\nGame rules:\n1. The player is on the roof. An English clue sits at the bottom, with a patience bar. Balloons rise from below, each carrying one English word. Only one word matches the clue. The player pops that balloon before it floats off the top.\n2. A correct pop bursts into confetti, adds points, and Combo increases by one. A one-line English meaning stays for about one second, then the next clue appears. Popping a wrong balloon costs patience and resets Combo. If the correct balloon escapes, it counts as a miss and patience drops again. The game ends when patience reaches zero or after 60 seconds. Wrong pops and misses reduce patience only, not the remaining time.\n3. Combo builds with correct pops in a row. From three in a row, the score is multiplied by 1.5, then 2, then 3, with a score burst. Every fifth clue in a row releases a gold balloon, and a correct pop scores double. Difficulty rises: balloons rise slowly and the wrong words are unrelated at the start; they rise faster and look or mean alike in the middle; near the end, two correct balloons must be popped in order before they escape.\n4. Clues are drawn at random from everyday English for Hong Kong Primary 4 to Primary 6, including sentence gaps and simple definitions. At least 80 words, each with one English meaning. At the end, show that round's word book (word, clue, meaning), then allow a Word file download.",
        limit: "- English only, for Primary 4 to Primary 6. Do not show any Chinese characters\n- Support mouse, touch, phones, and computers\n- HTML, CSS, and JavaScript in one file that runs when opened\n- One clue has one correct word; a two-word clue must be popped in order\n- Animation must be smooth: balloons rise, a correct balloon pops, a wrong balloon shreds, and the score and Combo effects play"
    },
    {
        id: "times",
        label: "乘法守門員",
        role: "你是一位擅長製作數學教育遊戲的前端工程師。",
        task: "請建立可直接遊玩的單頁遊戲《乘法守門員》：淺色球場，球要大，數字清晰。畫面要有遊戲感，不要像測驗卷或工作紙。\n遊戲機制：\n1. 玩家是守門員。上方顯示一題乘法，例如 7×8，旁邊有耐心條。三個球同時從不同方向飛向龍門，每個球寫一個答案，只有一個正確。玩家要撲向正確那個球。\n2. 撲中後，球抱入懷裡，加分，Combo 加一，約一秒顯示算式，隨即下一題。撲錯就入球，Combo 中斷，耐心下降。正確的球飛過而未撲到，視作失球，耐心再降。耐心歸零或 60 秒完結，遊戲結束。失球只扣耐心，不扣剩餘時間。\n3. 連續撲中累積 Combo，三連擊起分數以 1.5、2、3 倍計算，並有得分特效。連續五題出現十二碼，撲中雙倍分。難度逐步提升：開局球慢、錯誤答案相差遠；中段球快、答案很接近；尾段耐心較短，間中左右兩球都要按順序撲中。\n4. 題目隨機抽取，以小四至小六乘法為主，不少於 60 題。結束後先顯示該局題目和正確答案，再可下載 Word 檔。",
        limit: "- 繁體中文，適合小四至小六\n- 支援滑鼠、觸控、手機及電腦\n- HTML、CSS、JavaScript 全部放在單一檔案，開啟即可執行\n- 每題只有一個正確答案；連發題要按順序撲中\n- 動畫要流暢：球飛來、撲中抱住、撲錯入網、得分與 Combo 特效"
    }
];
const MAKE_EXAMPLES_SEC = [
    {
        id: "sec-eng",

let state = loadState();

function loadState() {
    const base = { activity: "prompt", helperBand: "", band: "", page: "hub", playMode: "", playId: "", makeId: "", copyMsg: "", lockError: "", makeRole: "", makeTask: "", makeLimit: "", makeTips: false, makeExample: "" };
    try {
        const saved = JSON.parse(sessionStorage.getItem(STORAGE_KEY) || "{}");
        if (saved.activity === "prompt" || saved.activity === "helper" || saved.activity === "make") base.activity = saved.activity;
        else if (saved.page === "make") base.activity = "make";
        else if (saved.playMode === "vibe") base.activity = "helper";
        else if (saved.page === "play" || saved.playMode === "prompt") base.activity = "prompt";
        if (saved.helperBand === "pri" || saved.helperBand === "sec") base.helperBand = saved.helperBand;
        else if (base.activity === "helper" && (saved.band === "pri" || saved.band === "sec")) base.helperBand = saved.band;
        if (saved.band === "pri" || saved.band === "sec") base.band = saved.band;
        if (saved.page === "play" || saved.page === "make") base.page = saved.page;
        if (saved.playMode === "prompt" || saved.playMode === "vibe") base.playMode = saved.playMode;
        if (PLAY.some(function (s) { return s.id === saved.playId; })) base.playId = saved.playId;
        const themes = MAKE[base.band] || [];
        if (themes.some(function (t) { return t.id === saved.makeId; })) {
            base.makeId = saved.makeId;
        }
        if (typeof saved.makeRole === "string") base.makeRole = saved.makeRole;
        if (typeof saved.makeTask === "string") base.makeTask = saved.makeTask;
        if (typeof saved.makeLimit === "string") base.makeLimit = saved.makeLimit;
        if (["blank", "base"].indexOf(saved.makeExample) >= 0 || MAKE_EXAMPLES_PRI.concat(MAKE_EXAMPLES_SEC).some(function (item) { return item.id === saved.makeExample; })) base.makeExample = saved.makeExample;
    } catch (e) {}
    return base;
}

function saveState() {
    sessionStorage.setItem(STORAGE_KEY, JSON.stringify({
        activity: state.activity,
        helperBand: state.helperBand,
        band: state.band,
        page: state.page,
        playMode: state.playMode,
        playId: state.playId,
        makeId: state.makeId,
        makeRole: state.makeRole,
        makeTask: state.makeTask,
        makeLimit: state.makeLimit,
        makeExample: state.makeExample

}

    const chips = chipRow(PLAY.map(function (s) {
        return { action: "play", value: s.id, label: s.title, on: state.playId === s.id };
    }));
    const subject = playById(state.playId);
    let panel = "";
    if (subject) {
        const mathNote = subject.id === "math" ? subject.hint : "";
        const source = subject.source
            ? '<p class="src-line">' + escapeHtml(subject.source) + "</p>"
            : "";
        panel = '<div class="panel">' +
            subjectDownloads(subject.id) +
            levelBlock("basic", "Level 1", subject.basic, "", "lv1") +
            levelBlock("mid", "Level 2", subject.mid, mathNote, "lv2") +
            levelBlock("high", "Level 3", subject.high(state.band), "", "lv3") +
            source +
            "</div>";
    }
    return chips +
        '<p class="lede">請先選擇一個科目，每個科目分為三個程度。英文及數學部分須先下載參考圖片，上載至 Gemini，再按「複製」，將提示詞貼上。</p>' +

const SEC_CHAT_IMAGES = [
    "games/sec-chat-1.png",
    "games/sec-chat-2.png",
    "games/sec-chat-3.png",
    "games/sec-chat-4.png",
    "games/sec-chat-5.png",
    "games/sec-chat-6.png"
];
let secChatPage = 0;

function secChatPageCount() {
    return Math.ceil(SEC_CHAT_IMAGES.length / 2);
}

function secChatShots(page) {
    const start = page * 2;
    return SEC_CHAT_IMAGES.slice(start, start + 2).map(function (src) {
        return '<div class="chat-shot"><img src="' + src + '" alt="" draggable="false"><div class="chat-shield"></div></div>';
    }).join("");
}

function secVibeToolsMarkup() {
    const pages = secChatPageCount();
    return '<div class="game-tools">' +
        '<button type="button" class="ghost-btn" data-action="reveal" data-value="reveal-prompt" aria-expanded="false">展示prompt</button>' +
        '<button type="button" class="ghost-btn" data-action="reveal" data-value="reveal-chat" aria-expanded="false">展示與AI的完整對話</button>' +
        '<button type="button" class="ghost-btn" data-action="download-code">下載完整代碼</button>' +
        "</div>" +
        '<div id="reveal-prompt" class="reveal-panel nocopy"><pre class="prompt-view">' + escapeHtml(SEC_GAME_PROMPT) + "</pre></div>" +
        '<div id="reveal-chat" class="reveal-panel nocopy">' +
        '<div class="chat-row" id="sec-chat-row">' + secChatShots(0) + "</div>" +
        '<div class="chat-pager">' +
        '<button type="button" class="ghost-btn" id="sec-chat-prev" data-action="chat-page" data-value="prev" disabled>上一頁</button>' +
        '<span id="sec-chat-label">1 / ' + pages + "</span>" +
        '<button type="button" class="ghost-btn" id="sec-chat-next" data-action="chat-page" data-value="next"' + (pages < 2 ? " disabled" : "") + ">下一頁</button>" +
        "</div></div>";
}

function showSecChatPage(page) {
    const pages = secChatPageCount();
    secChatPage = Math.max(0, Math.min(pages - 1, page));
    const row = document.getElementById("sec-chat-row");
    if (row) row.innerHTML = secChatShots(secChatPage);
    const label = document.getElementById("sec-chat-label");
    if (label) label.textContent = (secChatPage + 1) + " / " + pages;
    const prev = document.getElementById("sec-chat-prev");
    const next = document.getElementById("sec-chat-next");
    if (prev) prev.disabled = secChatPage === 0;
    if (next) next.disabled = secChatPage >= pages - 1;
}

function renderHelper() {
    if (state.band === "sec") {
        const frame = '<iframe class="game-frame" title="尋找桃花源" src="games/peach-blossom.html"></iframe>';
        if (!lockOpen("vibe")) return frame + vibeLockMarkup();
        return frame + secVibeToolsMarkup();
    }
    if (state.band !== "pri") return "";
    const frame = '<iframe class="game-frame" title="成語迴轉壽司店" src="games/idiom-sushi.html"></iframe>';
    if (!lockOpen("vibe")) return frame + vibeLockMarkup();
    return frame + vibeToolsMarkup();
}

function downloadGameCode() {
    const sec = state.band === "sec";
    fetch(sec ? "games/peach-blossom.html" : "games/idiom-sushi.html").then(function (res) {
        if (!res.ok) throw new Error("missing");
        return res.text();
    }).then(function (text) {
        const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = sec ? "尋找桃花源.txt" : "成語迴轉壽司店.txt";
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
    }).catch(function () {});
}

function insideLockedCopy(node) {
    const el = node && node.nodeType === 1 ? node : node && node.parentElement;
    return !!(el && el.closest && el.closest(".nocopy"));
}

function makeExamples() {
    return state.band === "sec" ? MAKE_EXAMPLES_SEC : MAKE_EXAMPLES_PRI;
}

function syncMakeFields() {
    const role = document.getElementById("make-role");
    const task = document.getElementById("make-task");
    const limit = document.getElementById("make-limit");
    if (role) state.makeRole = role.value;
    if (task) state.makeTask = task.value;
    if (limit) state.makeLimit = limit.value;
}

function makePromptText() {
    const english = state.makeExample === "vocab" || state.makeExample === "sec-eng";
    const role = english ? "# Role" : "# 角色";
    const task = english ? "# Background and task" : "# 背景與任務";
    const limit = english ? "# Instructions and limits" : "# 指導與限制";
    return role + "\n" + (state.makeRole || "") + "\n\n" + task + "\n" + (state.makeTask || "") + "\n\n" + limit + "\n" + (state.makeLimit || "");
}

function applyMakePrompt(parts, exampleId) {
    state.makeRole = parts.role;
    state.makeTask = parts.task;
    state.makeLimit = parts.limit;
    state.makeExample = exampleId || "";
}

function renderMake() {
    const helped = lockOpen("help");
    const copied = state.copyMsg === "make-all";
    const tips = state.makeTips
        ? '<div class="tip-panel">' + makeTips().map(function (line, index) {
            const ok = state.copyMsg === "tip-" + index;
            return '<div class="tip-item"><p>' + escapeHtml(line) + "</p>" +
                '<button type="button" class="pill-btn" data-action="copy-tip" data-value="' + index + '">複製</button>' +
                (ok ? '<span class="copy-ok">已複製</span>' : "") + "</div>";
        }).join("") + "</div>"
        : "";
    const examples = helped
        ? '<div class="make-examples"><p class="lede">如果想不到，可以選擇例子。</p><div class="chip-row">' +
            makeExamples().map(function (item) {
                return '<button type="button" class="pill-btn' + (state.makeExample === item.id ? " on" : "") + '" data-action="make-example" data-value="' + item.id + '">' + escapeHtml(item.label) + "</button>";
            }).join("") + "</div></div>"
        : "";
    const helpBtn = helped
        ? ""
        : '<button type="button" class="pill-btn" data-action="open-make-help">需要幫忙</button>';
    const modal = helped
        ? ""
        : '<div class="modal-back" id="make-gate" data-action="close-make-help" hidden>' +
            '<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="make-lock-title">' +
            '<p class="lede" id="make-lock-title">請輸入密碼，以取得填空提示。</p>' +
            '<input type="password" id="lock-pass" placeholder="密碼" autocomplete="off">' +
            '<p class="error-text" hidden>密碼不正確</p>' +
            '<div class="btn-row"><button type="button" class="primary-btn" data-action="unlock" data-value="help">確認</button>' +
            '<button type="button" class="ghost-btn" data-action="close-make-help">關閉</button></div></div></div>';
    return '<div class="make-layout"><div class="make-main">' +
        '<div class="make-block"><h3># 角色</h3><p class="make-hint">你希望 AI 是甚麼身份？例如：擅長製作哪一科教育遊戲的前端工程師？</p><textarea id="make-role">' + escapeHtml(state.makeRole) + "</textarea></div>" +
        '<div class="make-block"><h3># 背景與任務</h3><p class="make-hint">遊戲叫甚麼名字？畫面像甚麼？想要甚麼風格？遊戲機制可以寫四點：玩家是誰、要做甚麼動作？答對和答錯分別發生甚麼，遊戲幾時結束？連續答對有甚麼獎勵，難度怎樣提升？題目從哪裡來，玩完看到甚麼？</p><textarea id="make-task">' + escapeHtml(state.makeTask) + "</textarea></div>" +
        '<div class="make-block"><h3># 指導與限制</h3><p class="make-hint">用甚麼語言、給哪個年級？要支援滑鼠、觸控、手機和電腦嗎？程式要不要放在單一檔案？答案和動畫有甚麼規則？</p><textarea id="make-limit">' + escapeHtml(state.makeLimit) + "</textarea></div>" +
        '<div class="btn-row"><button type="button" class="primary-btn" data-action="copy-make">' + icon("copy") + "複製全部</button>" +
        (copied ? '<span class="copy-ok">已複製</span>' : "") + "</div>" +
        examples +
        "</div><div class=\"make-side\">" +
        '<button type="button" class="pill-btn' + (state.makeTips ? " on" : "") + '" data-action="toggle-tips" aria-expanded="' + (state.makeTips ? "true" : "false") + '">小錦囊</button>' +
        (helped
            ? '<button type="button" class="pill-btn' + (state.makeExample === "blank" ? " on" : "") + '" data-action="make-blank">空白版</button>' +
                '<button type="button" class="pill-btn' + (state.makeExample === "base" ? " on" : "") + '" data-action="make-base">基礎版</button>'
            : "") +
        helpBtn + tips +
        "</div></div>" + modal;
}

function bandIcon(kind) {
    const pri = '<path d="M8 20V10"/><path d="M16 20V10"/><path d="M4 20h16"/><path d="M12 4l8 6H4z"/><path d="M10 20v-4h4v4"/>';
    const sec = '<path d="M3 10l9-6 9 6-9 6z"/><path d="M7 12v5c0 1.5 2.2 3 5 3s5-1.5 5-3v-5"/><path d="M21 10v6"/>';
    return '<svg class="band-ico" viewBox="0 0 24 24" aria-hidden="true">' + (kind === "pri" ? pri : sec) + "</svg>";
}

function renderHome() {
    return '<p class="lede">請先選擇小學或中學。</p><div class="band-row">' +
        '<button type="button" class="band-card" data-action="band" data-value="pri">' + bandIcon("pri") + "<strong>小學</strong><em>小四至小六</em></button>" +
        '<button type="button" class="band-card" data-action="band" data-value="sec">' + bandIcon("sec") + "<strong>中學</strong><em>中一至中三</em></button>" +
        "</div>";
}

function render() {
    const scrollY = window.scrollY;
    const viewKey = state.activity + "|" + state.helperBand + "|" + state.band + "|" + state.playId + "|" + state.makeId;
    const keepScroll = state._viewKey === viewKey;
    let html;
    if (!state.band) {
        html = '<section class="column">' + renderHome() + "</section>";
    } else {
        const nav = segBar([
            { action: "activity", value: "prompt", label: "Go Play：引導式提示詞", on: state.activity === "prompt" },
            { action: "activity", value: "helper", label: "Go Play：互動學習遊戲", on: state.activity === "helper" },
            { action: "activity", value: "make", label: "Go Make：親子共創", on: state.activity === "make" }
        ]);
        const back = '<div class="back-row"><button type="button" class="back-btn" data-action="home">返回選擇小學或中學</button></div>';
        let below = "";
        if (state.activity === "prompt") below = renderPrompting();
        if (state.activity === "helper") below = renderHelper();
        if (state.activity === "make") below = renderMake();
        html = '<section class="column">' + back + nav + below + "</section>";
    }
    document.body.classList.toggle("playing-game", (state.band === "pri" || state.band === "sec") && state.activity === "helper");
    document.getElementById("app").innerHTML = html;
    saveState();
    state._viewKey = viewKey;
    sizePromptAreas();
    window.scrollTo(0, keepScroll ? scrollY : 0);
}

function promptContentHeight(el) {
    const prev = el.style.height;
    el.style.height = "auto";
    const full = el.scrollHeight;
    el.style.height = prev;
    return full;
}

function sizePromptAreas() {
    const level3 = document.getElementById("play-high");
    if (level3) level3.style.height = (promptContentHeight(level3) + 8) + "px";
    const make = document.getElementById("make-prompt");
    if (make) {
        const panel = make.closest(".panel");
        const footer = document.querySelector(".site-footer");
        const makeTop = make.getBoundingClientRect().top + window.scrollY;
        const afterBox = panel
            ? panel.getBoundingClientRect().bottom - make.getBoundingClientRect().bottom
            : 140;
        const footerSpace = footer ? footer.offsetHeight + 48 : 0;
        const available = window.innerHeight - makeTop - afterBox - footerSpace - 16;
        const full = promptContentHeight(make);
        make.style.height = Math.max(120, Math.min(full, Math.round(available))) + "px";
        const overflow = document.documentElement.scrollHeight - window.innerHeight;
        if (overflow > 0) {
            const next = parseFloat(make.style.height) - overflow - 4;
            make.style.height = Math.max(96, Math.round(next)) + "px";
        }
    }
}

function copyText(text, msg) {
    function done() {
        state.copyMsg = msg;
        render();
    }
    function fallback() {
        const area = document.createElement("textarea");
        area.value = text;
        area.setAttribute("readonly", "");
        area.style.position = "fixed";
        area.style.left = "-9999px";
        document.body.appendChild(area);
        area.select();
        try { document.execCommand("copy"); } catch (e) {}
        document.body.removeChild(area);
        done();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
        let finished = false;
        function finish() {
            if (finished) return;
            finished = true;
            done();
        }
        navigator.clipboard.writeText(text).then(finish).catch(function () {
            fallback();
            finish();
        });
        setTimeout(function () {
            if (!finished) {
                fallback();
                finish();
            }
        }, 500);
    } else {
        fallback();
    }
}

document.addEventListener("click", function (event) {
    const btn = event.target.closest("[data-action]");
    if (!btn) return;
    const action = btn.getAttribute("data-action");
    const value = btn.getAttribute("data-value");
    syncMakeFields();
    if (action !== "unlock") state.lockError = "";
    if (action !== "copy-tip" && action !== "copy-make") state.copyMsg = "";
    if (action === "home") {
        state.band = "";
    } else if (action === "activity") {
        state.activity = value;
    } else if (action === "helper-band") {
        state.helperBand = value;
    } else if (action === "band") {
        if (state.band !== value) {
            state.band = value;
            state.makeId = "";
            state.makeRole = "";
            state.makeTask = "";
            state.makeLimit = "";
            state.makeExample = "";
        }
    } else if (action === "open") {
        state.page = value;
    } else if (action === "play-mode") {
        state.playMode = value;
    } else if (action === "play") {
        state.playId = value;
    } else if (action === "make") {
        state.makeId = value;
    } else if (action === "open-vibe-lock") {
        const gate = document.getElementById("vibe-gate");
        if (gate) {
            gate.hidden = false;
            const err = gate.querySelector(".error-text");
            if (err) err.hidden = true;
            const input = document.getElementById("lock-pass");
            if (input) input.focus();
        }
        return;
    } else if (action === "close-vibe-lock") {
        if (event.target !== btn) return;
        const gate = document.getElementById("vibe-gate");
        if (gate) gate.hidden = true;
        return;
    } else if (action === "unlock") {
        const typed = (document.getElementById("lock-pass").value || "").trim();
        if (typed === LOCK_PASS[value]) {
            try { sessionStorage.setItem("pcws-lock-" + value, "1"); } catch (e) {}
            state.lockError = "";
            if (value === "vibe") {
                const wrap = document.getElementById("vibe-gate-wrap");
                if (wrap) wrap.outerHTML = state.band === "sec" ? secVibeToolsMarkup() : vibeToolsMarkup();
                return;
            }
            if (value === "help") applyMakePrompt(makeScaffold(), "base");
        } else {
            state.lockError = value;
            if (value === "vibe" || value === "help") {
                const err = document.querySelector(value === "vibe" ? "#vibe-gate .error-text" : "#make-gate .error-text");
                if (err) err.hidden = false;
                return;
            }
        }
    } else if (action === "open-make-help") {
        const gate = document.getElementById("make-gate");
        if (gate) {
            gate.hidden = false;
            const err = gate.querySelector(".error-text");
            if (err) err.hidden = true;
            const input = document.getElementById("lock-pass");
            if (input) input.focus();
        }
        return;
    } else if (action === "close-make-help") {
        if (event.target !== btn) return;
        const gate = document.getElementById("make-gate");
        if (gate) gate.hidden = true;
        return;
    } else if (action === "toggle-tips") {
        state.makeTips = !state.makeTips;
    } else if (action === "make-blank") {
        state.makeRole = "";
        state.makeTask = "";
        state.makeLimit = "";
        state.makeExample = "blank";
    } else if (action === "make-base") {
        applyMakePrompt(makeScaffold(), "base");
    } else if (action === "make-example") {
        const example = makeExamples().filter(function (item) { return item.id === value; })[0];
        if (example) applyMakePrompt(example, example.id);
    } else if (action === "copy-make") {
        copyText(makePromptText(), "make-all");
        return;
    } else if (action === "copy-tip") {
        const line = makeTips()[Number(value)];
        if (line) copyText(line, "tip-" + value);
        return;
    } else if (action === "copy") {
        const text = value === "make"
            ? currentPrompt()
            : (document.getElementById(value) || {}).value || "";
        if (text) copyText(text, value === "make" ? "make" : value);
        return;
    } else if (action === "reveal") {
        const panel = document.getElementById(value);
        if (!panel) return;
        const willOpen = !panel.classList.contains("open");
        document.querySelectorAll(".reveal-panel").forEach(function (other) {
            other.classList.remove("open");
        });
        document.querySelectorAll('.game-tools [data-action="reveal"]').forEach(function (otherBtn) {
            otherBtn.setAttribute("aria-expanded", "false");
        });
        if (willOpen) {
            panel.classList.add("open");
            btn.setAttribute("aria-expanded", "true");
            panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }
        const chatPanel = document.getElementById("reveal-chat");
        document.body.classList.toggle("chat-open", !!(chatPanel && chatPanel.classList.contains("open")));
        if (willOpen && value === "reveal-chat" && state.band === "sec") showSecChatPage(0);
        return;
    } else if (action === "chat-page") {
        showSecChatPage(secChatPage + (value === "next" ? 1 : -1));
        return;
    } else if (action === "download-code") {
        downloadGameCode();
        return;
    }
    render();
});

["copy", "cut", "contextmenu", "dragstart", "selectstart"].forEach(function (type) {
    document.addEventListener(type, function (event) {
        if (!insideLockedCopy(event.target)) return;
        event.preventDefault();
        if (event.clipboardData) event.clipboardData.setData("text/plain", "");
    });
});

document.addEventListener("keydown", function (event) {
    const key = (event.key || "").toLowerCase();
    const shortcut = (event.metaKey || event.ctrlKey) && (key === "c" || key === "x" || key === "a" || key === "s" || key === "p" || key === "u");
    if (!shortcut) return;
    const sel = window.getSelection();
    const selected = sel && sel.anchorNode && insideLockedCopy(sel.anchorNode);
    if (insideLockedCopy(event.target) || selected) event.preventDefault();
}, true);

document.getElementById("app").addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
        ["vibe-gate", "make-gate"].forEach(function (id) {
            const gate = document.getElementById(id);
            if (gate && !gate.hidden) gate.hidden = true;
        });
        return;
    }
    if (event.key !== "Enter" || event.target.id !== "lock-pass") return;
    event.preventDefault();
    const openGate = event.target.closest(".modal-back");
    const btn = openGate ? openGate.querySelector('[data-action="unlock"]') : null;
    if (btn) btn.click();
});

window.addEventListener("resize", sizePromptAreas);
render();
</script>
